name: Release windows x64

# Publishes a release from a tag, e.g. `gantri-v1.0.0`.
# The tag only names the Gantri fork: the SuperSlicer version stays pinned to the one
# in version.inc, and the fork version goes into the build id suffix, so the About
# dialog reads `SuperSlicer_2.5.59.2+gantri.1.0.0`.
#
# Running this manually (workflow_dispatch) builds and uploads the artifact but does
# not publish anything, which is the way to rehearse a release before tagging.

on:
  push:
    tags:
      - 'gantri-v*'
  workflow_dispatch:

jobs:
  build_dep:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4
    - uses: ilammy/msvc-dev-cmd@v1
      with:
        toolset: '14.29'
    - name: mkdir in deps
      run: mkdir deps/build
    - name: cmake and make deps
      working-directory: ./deps/build
      run: |
        cmake .. -G "Visual Studio 17 2022" -A x64 -T v142
        msbuild /m ALL_BUILD.vcxproj
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: deps_win
        path: ./deps/build/destdir/
        include-hidden-files: true

  build:
    runs-on: windows-2022
    needs: build_dep
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - uses: ilammy/msvc-dev-cmd@v1
      with:
        toolset: '14.29'
    - name: update submodule profiles
      working-directory: ./resources/profiles
      run: git submodule update --init
    - name: resolve version from the tag
      shell: powershell
      run: |
        if ($env:GITHUB_REF -like 'refs/tags/*') {
          $ver = $env:GITHUB_REF_NAME -replace '^gantri-v', ''
        } else {
          $ver = "dev." + $env:GITHUB_SHA.Substring(0, 7)
        }
        Write-Host "Gantri version: $ver"
        Add-Content -Path $env:GITHUB_ENV -Value "GANTRI_VERSION=$ver"
    - name: stamp version
      shell: powershell
      run: (Get-Content version.inc) | Foreach-Object {$_ -replace "\+UNKNOWN", ("+gantri." + $env:GANTRI_VERSION)} | Set-Content version.inc
    - name: mkdir in deps directory
      run: mkdir deps/destdir
    - name: download deps
      uses: actions/download-artifact@v4
      with:
        name: deps_win
        path: deps/destdir
    - name: mkdir
      run: mkdir build
    - name: cmake
      working-directory: ./build
      run: cmake .. -G "Visual Studio 17 2022" -A x64 -T v142 -DCMAKE_PREFIX_PATH="${{ github.workspace }}\deps\destdir\usr\local"
    - name: make
      working-directory: ./build
      run: msbuild /m /P:Configuration=Release INSTALL.vcxproj
    - name: make .mo
      working-directory: ./build
      run: msbuild /m /P:Configuration=Release gettext_po_to_mo.vcxproj
    - name: make .pot
      working-directory: ./build
      run: msbuild /m /P:Configuration=Release gettext_make_pot.vcxproj
    - name: create package directory
      working-directory: ./build
      shell: powershell
        #todo: add the opengl folder
      run: mkdir package
    - name: copy from release
      working-directory: ./build
      shell: powershell
      run: '(new-object System.Net.WebClient).DownloadFile("https://github.com/supermerill/SuperSlicer_deps/releases/download/1.75/Slic3r_win_build.zip", "Slic3r_win_build.zip")'
    - name: unzip
      working-directory: ./build
      shell: cmd
      run: '"C:/Program Files/7-Zip/7z.exe" x Slic3r_win_build.zip'
    - name: copy missing dll content from old release
      working-directory: ./build
      shell: cmd
      run: |
        xcopy /RCYIE Slic3r_win_build\*.dll package\
        xcopy /RCYIE Slic3r_win_build\local-settings.bat package\${{ github.event.repository.name }}_local-settings.bat
        xcopy /RCYIE Slic3r_win_build\mesa package\
    - name: copy new resources
      working-directory: ./build
      shell: cmd
      run: |
        xcopy /RCYIE ..\resources package\resources
        del /S /Q package\resources\localization\*.so
    - name: copy dll & exe
      working-directory: ./build
      shell: cmd
      run: |
        xcopy /RCYIE src\release\*.dll package\
        xcopy /RCYIE src\release\*.exe package\
        xcopy /RCYIE c:\windows\system32\VCRUNTIME140* package\
        del package\opengl32.dll
    - name: create zip
      working-directory: ./build
      shell: cmd
      run: '"C:/Program Files/7-Zip/7z.exe" a -tzip ..\SuperSlicer_Gantri_%GANTRI_VERSION%_win64.zip .\package\*'
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: SuperSlicer_Gantri_${{ env.GANTRI_VERSION }}_win64
        path: build/package/
    - name: publish release
      if: startsWith(github.ref, 'refs/tags/')
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$GITHUB_REF_NAME" \
          --title "SuperSlicer Gantri $GANTRI_VERSION" \
          --generate-notes \
          "SuperSlicer_Gantri_${GANTRI_VERSION}_win64.zip"

name: Release windows x64

# Every merge into gantri-main builds Windows once and publishes a release from it,
# tag included: the version is the next patch after the newest gantri-v* tag, and
# `gh release create` creates that tag on the merge commit.
#
# Every merge into gantri-beta builds the same way but publishes a pre-release, so a
# feature can be tried on real parts before it goes into an official release. Its
# version is the next official one plus a counter: 1.0.12-beta.1, 1.0.12-beta.2, ...
# The counter restarts once 1.0.12 ships from gantri-main.
# gantri-beta is never merged into gantri-main: a feature reaches gantri-main through
# its own branch once it is approved.
#
# The version names the Gantri fork only. The SuperSlicer version stays pinned to the
# one in version.inc and the fork version goes into the build id suffix, so the About
# dialog reads `SuperSlicer_2.5.59.2+gantri.1.0.1`.
#
# Running this by hand (workflow_dispatch) builds and uploads the artifact without
# tagging or publishing anything, which is how to rehearse the whole thing.
#
# Linux is built from the same commit and attached to the same release as an AppImage
# (SuperSlicer_Gantri_<version>_linux64.AppImage). Services that slice without a desktop
# run it headless. It waits for the Windows build, which resolves the version and
# publishes the release; a Linux failure leaves the Windows release in place.

on:
  push:
    branches:
      - gantri-main
      - gantri-beta
    # A merge that only changes the CI itself has nothing new to ship.
    paths-ignore:
      - '.github/**'
  workflow_dispatch:

jobs:
  build_dep:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4
    - uses: ilammy/msvc-dev-cmd@v1
      with:
        toolset: '14.29'
    - name: deps cache key
      # The tree hash of deps/ as committed. hashFiles cannot be used here: the cache
      # re-evaluates its key on the post step, by which point deps/ also holds the build
      # tree with every dependency source unpacked, and walking it times out.
      id: deps_key
      shell: bash
      run: echo "sha=$(git rev-parse HEAD:deps)" >> $GITHUB_OUTPUT
    - name: cache deps
      # Rebuilt only when a dependency recipe or patch changes. Everything the build
      # consumes lives in destdir, so a hit skips ~40 minutes of compiling.
      id: cache_deps
      uses: actions/cache@v4
      with:
        path: ./deps/build/destdir
        key: deps-win-x64-v142-${{ steps.deps_key.outputs.sha }}
    - name: mkdir in deps
      if: steps.cache_deps.outputs.cache-hit != 'true'
      run: mkdir deps/build
    - name: cmake and make deps
      if: steps.cache_deps.outputs.cache-hit != 'true'
      working-directory: ./deps/build
      run: |
        cmake .. -G "Visual Studio 17 2022" -A x64 -T v142
        msbuild /m ALL_BUILD.vcxproj
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: deps_win
        path: ./deps/build/destdir/
        include-hidden-files: true
        # Plumbing to hand the deps to the build job, not something anyone downloads.
        retention-days: 1

  build:
    runs-on: windows-2022
    needs: build_dep
    permissions:
      contents: write
    outputs:
      # The Linux build stamps and publishes under this same version.
      version: ${{ steps.version.outputs.version }}

    steps:
    - uses: actions/checkout@v4
      with:
        # Tags are needed to work out the next version.
        fetch-depth: 0
    - uses: ilammy/msvc-dev-cmd@v1
      with:
        toolset: '14.29'
    - name: install gettext
      # msgfmt and xgettext came preinstalled on the windows-2019 image; they do not on
      # windows-2022, and the .mo/.pot targets call them by name from PATH.
      shell: powershell
      run: |
        $ErrorActionPreference = 'Stop'
        # Taken straight from the upstream release rather than through Chocolatey, whose
        # feed answers 504 often enough to break a build for reasons of its own.
        $url = 'https://github.com/mlocati/gettext-iconv-windows/releases/download/v1.0-v1.19/gettext1.0-iconv1.19-static-64.zip'
        $zip = Join-Path $env:RUNNER_TEMP 'gettext.zip'
        $dir = Join-Path $env:RUNNER_TEMP 'gettext'
        Invoke-WebRequest -Uri $url -OutFile $zip
        Expand-Archive -Path $zip -DestinationPath $dir -Force
        # Searched inside our own extraction directory only: walking Program Files trips
        # over system folders the runner may not read.
        $exe = Get-ChildItem -Path $dir -Filter msgfmt.exe -Recurse | Select-Object -First 1
        if (-not $exe) { throw 'msgfmt.exe not found in the gettext archive' }
        # The job captured its PATH at start, so a later msbuild step only sees what is
        # published here. Running msgfmt now fails at minute one, not fifteen minutes in.
        Add-Content -Path $env:GITHUB_PATH -Value $exe.DirectoryName
        & $exe.FullName --version
    - name: update submodule profiles
      working-directory: ./resources/profiles
      run: git submodule update --init
    - name: resolve version
      id: version
      shell: powershell
      run: |
        $ErrorActionPreference = 'Stop'
        if ($env:GITHUB_EVENT_NAME -ne 'push') {
          # Rehearsal run: never claims a version number a real release could want.
          $ver = "dev." + $env:GITHUB_SHA.Substring(0, 7)
        } else {
          # Official tags only: a beta tag like gantri-v1.0.12-beta.1 is not a [version].
          $last = git tag -l 'gantri-v*' |
                  Where-Object { $_ -match '^gantri-v\d+\.\d+\.\d+$' } |
                  Sort-Object { [version]($_ -replace '^gantri-v', '') } |
                  Select-Object -Last 1
          if ($last) {
            $v = [version]($last -replace '^gantri-v', '')
            $ver = "$($v.Major).$($v.Minor).$($v.Build + 1)"
          } else {
            $ver = '1.0.0'
          }
          if ($env:GITHUB_REF_NAME -eq 'gantri-beta') {
            $n = @(git tag -l "gantri-v$ver-beta.*").Count + 1
            $ver = "$ver-beta.$n"
          }
        }
        Write-Host "Gantri version: $ver"
        Add-Content -Path $env:GITHUB_ENV -Value "GANTRI_VERSION=$ver"
        Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$ver"
    - name: stamp version
      shell: powershell
      run: (Get-Content version.inc) | Foreach-Object {$_ -replace "\+UNKNOWN", ("+gantri." + $env:GANTRI_VERSION)} | Set-Content version.inc
    - name: mkdir in deps directory
      run: mkdir deps/destdir
    - name: download deps
      uses: actions/download-artifact@v4
      with:
        name: deps_win
        path: deps/destdir
    - name: mkdir
      run: mkdir build
    - name: cmake
      working-directory: ./build
      run: cmake .. -G "Visual Studio 17 2022" -A x64 -T v142 -DCMAKE_PREFIX_PATH="${{ github.workspace }}\deps\destdir\usr\local"
    - name: make
      working-directory: ./build
      run: msbuild /m /P:Configuration=Release INSTALL.vcxproj
    - name: make .mo
      working-directory: ./build
      run: msbuild /m /P:Configuration=Release gettext_po_to_mo.vcxproj
    - name: make .pot
      working-directory: ./build
      run: msbuild /m /P:Configuration=Release gettext_make_pot.vcxproj
    - name: create package directory
      working-directory: ./build
      shell: powershell
        #todo: add the opengl folder
      run: mkdir package
    - name: copy from release
      working-directory: ./build
      shell: powershell
      run: '(new-object System.Net.WebClient).DownloadFile("https://github.com/supermerill/SuperSlicer_deps/releases/download/1.75/Slic3r_win_build.zip", "Slic3r_win_build.zip")'
    - name: unzip
      working-directory: ./build
      shell: powershell
      # Expand-Archive rather than 7-Zip: the runner image ships 7-Zip but documents no
      # install path, and this needs none. The archive holds a Slic3r_win_build folder.
      run: Expand-Archive -Path Slic3r_win_build.zip -DestinationPath . -Force
    - name: copy missing dll content from old release
      working-directory: ./build
      shell: cmd
      run: |
        xcopy /RCYIE Slic3r_win_build\*.dll package\
        xcopy /RCYIE Slic3r_win_build\local-settings.bat package\${{ github.event.repository.name }}_local-settings.bat
        xcopy /RCYIE Slic3r_win_build\mesa package\
    - name: copy new resources
      working-directory: ./build
      shell: cmd
      run: |
        xcopy /RCYIE ..\resources package\resources
        del /S /Q package\resources\localization\*.so
    - name: copy dll & exe
      working-directory: ./build
      shell: cmd
      run: |
        xcopy /RCYIE src\release\*.dll package\
        xcopy /RCYIE src\release\*.exe package\
        xcopy /RCYIE c:\windows\system32\VCRUNTIME140* package\
        del package\opengl32.dll
    - name: create zip
      working-directory: ./build
      shell: powershell
      run: Compress-Archive -Path .\package\* -DestinationPath "..\SuperSlicer_Gantri_${env:GANTRI_VERSION}_win64.zip" -Force
    - name: Upload artifact
      # Only on rehearsal runs, which publish nothing. On a real release the zip attached
      # to it is the single download, so the same files are not offered twice.
      if: github.event_name != 'push'
      uses: actions/upload-artifact@v4
      with:
        name: SuperSlicer_Gantri_${{ env.GANTRI_VERSION }}_win64
        path: build/package/
    - name: tag and publish release
      # Creates the tag on this commit as part of publishing, so a merge needs no manual
      # tagging and never triggers a second build.
      if: github.event_name == 'push'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # A beta is a pre-release: it never shows up as the latest release.
        prerelease=()
        if [ "$GITHUB_REF_NAME" = "gantri-beta" ]; then prerelease=(--prerelease); fi
        gh release create "gantri-v${GANTRI_VERSION}" \
          --target "$GITHUB_SHA" \
          --title "SuperSlicer Gantri $GANTRI_VERSION" \
          --generate-notes \
          "${prerelease[@]}" \
          "SuperSlicer_Gantri_${GANTRI_VERSION}_win64.zip"

  build_dep_linux:
    runs-on: ubuntu-22.04
    env:
      # CMake 4 refuses projects that declare a minimum below 3.5, which several of the
      # older dependency recipes do. This keeps them building on whatever CMake the image has.
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'

    steps:
    - uses: actions/checkout@v4
    - name: install system libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libglew-dev libudev-dev libdbus-1-dev curl libssl-dev libcurl4-openssl-dev m4
    - name: deps cache key
      # Same scheme as Windows: the committed tree hash of deps/.
      id: deps_key
      run: echo "sha=$(git rev-parse HEAD:deps)" >> "$GITHUB_OUTPUT"
    - name: cache deps
      id: cache_deps
      uses: actions/cache@v4
      with:
        path: ./deps/build/destdir
        key: deps-linux-x64-ubuntu2204-gtk3-${{ steps.deps_key.outputs.sha }}
    - name: cmake and make deps
      if: steps.cache_deps.outputs.cache-hit != 'true'
      run: |
        mkdir -p deps/build
        cd deps/build
        cmake .. -DDEP_WX_GTK3=ON
        make -j"$(nproc)"
        # The slicer's cmake looks for wxWidgets' scintilla under its GTK3-specific name.
        cp destdir/usr/local/lib/libwxscintilla-3.1.a destdir/usr/local/lib/libwx_gtk3u_scintilla-3.1.a
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: deps_linux
        path: ./deps/build/destdir/
        include-hidden-files: true
        retention-days: 1

  build_linux:
    runs-on: ubuntu-22.04
    needs: [build_dep_linux, build]
    permissions:
      contents: write
    env:
      GANTRI_VERSION: ${{ needs.build.outputs.version }}
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
      # The runner has no FUSE, so AppImages (appimagetool, then our own for the check)
      # unpack themselves instead of mounting.
      APPIMAGE_EXTRACT_AND_RUN: '1'

    steps:
    - uses: actions/checkout@v4
    - name: install system libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libglew-dev libudev-dev libdbus-1-dev curl libssl-dev libcurl4-openssl-dev m4
    - name: update submodule profiles
      working-directory: ./resources/profiles
      run: git submodule update --init
    - name: stamp version
      run: sed -i "s/+UNKNOWN/+gantri.${GANTRI_VERSION}/" version.inc
    - name: download deps
      uses: actions/download-artifact@v4
      with:
        name: deps_linux
        path: deps/build/destdir
    - name: cmake and make
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/deps/build/destdir/usr/local" -DSLIC3R_STATIC=1 -DSLIC3R_GTK=3 -DCMAKE_BUILD_TYPE=Release
        make -j"$(nproc)" Slic3r
        make gettext_po_to_mo
    - name: package AppImage
      working-directory: ./build
      run: |
        chmod +x src/BuildLinuxImage.sh
        src/BuildLinuxImage.sh -i
        mv SuperSlicer_ubu64.AppImage "../SuperSlicer_Gantri_${GANTRI_VERSION}_linux64.AppImage"
    - name: check the AppImage runs
      # Headless, the way services that slice with it run it; it must report this version.
      run: ./SuperSlicer_Gantri_${GANTRI_VERSION}_linux64.AppImage --help | grep -F "+gantri.${GANTRI_VERSION}"
    - name: Upload artifact
      # Rehearsal runs only, as on Windows.
      if: github.event_name != 'push'
      uses: actions/upload-artifact@v4
      with:
        name: SuperSlicer_Gantri_${{ env.GANTRI_VERSION }}_linux64
        path: SuperSlicer_Gantri_${{ env.GANTRI_VERSION }}_linux64.AppImage
    - name: attach to the release
      if: github.event_name == 'push'
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release upload "gantri-v${GANTRI_VERSION}" "SuperSlicer_Gantri_${GANTRI_VERSION}_linux64.AppImage"

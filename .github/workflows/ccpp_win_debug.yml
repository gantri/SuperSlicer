name: C/C++ debug windows x64

on:
  push:
    branches:
      - debug_win

jobs:
  build_dep:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4
      with:
        ref: 'debug_win'
    - uses: ilammy/msvc-dev-cmd@v1
      with:
        toolset: '14.29'
    - name: deps cache key
      # The tree hash of deps/ as committed. hashFiles cannot be used here: the cache
      # re-evaluates its key on the post step, by which point deps/ also holds the build
      # tree with every dependency source unpacked, and walking it times out.
      id: deps_key
      shell: bash
      run: echo "sha=$(git rev-parse HEAD:deps)" >> $GITHUB_OUTPUT
    - name: cache deps
      # Rebuilt only when a dependency recipe or patch changes. Everything the build
      # consumes lives in destdir, so a hit skips ~40 minutes of compiling.
      id: cache_deps
      uses: actions/cache@v4
      with:
        path: ./deps/build/destdir
        key: deps-win-x64-v142-${{ steps.deps_key.outputs.sha }}
    - name: mkdir in deps
      if: steps.cache_deps.outputs.cache-hit != 'true'
      run: mkdir deps/build
    - name: cmake and make deps
      if: steps.cache_deps.outputs.cache-hit != 'true'
      working-directory: ./deps/build
      run: |
        cmake .. -G "Visual Studio 17 2022" -A x64 -T v142
        msbuild /m ALL_BUILD.vcxproj
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: deps_win
        path: ./deps/build/destdir/
        include-hidden-files: true

  build:
    runs-on: windows-2022
    needs: build_dep

    steps:
    - uses: actions/checkout@v4
    - uses: ilammy/msvc-dev-cmd@v1
      with:
        toolset: '14.29'
    - name: install gettext
      # msgfmt and xgettext came preinstalled on the windows-2019 image; they do not on
      # windows-2022, and the .mo target calls msgfmt by name from PATH.
      shell: powershell
      run: |
        choco install gettext -y --no-progress
        # The installer edits the machine PATH, but this job captured its own at start,
        # so the later msbuild steps would still not see msgfmt. Publish it explicitly and
        # fail here, not fifteen minutes into the build, if it is not where we expect.
        $exe = Get-ChildItem -Path 'C:\Program Files\gettext-iconv' -Filter msgfmt.exe -Recurse |
               Select-Object -First 1
        if (-not $exe) { throw 'msgfmt.exe not found after installing gettext' }
        Add-Content -Path $env:GITHUB_PATH -Value $exe.DirectoryName
        & $exe.FullName --version
    - name: update submodule profiles
      working-directory: ./resources/profiles
      run: git submodule update --init
    - name: change date in version
      shell: powershell
      run: (Get-Content version.inc) | Foreach-Object {$_ -replace "\+UNKNOWN", ("_" + [datetime]::Today.ToString("yyyy-MM-dd"))} | Set-Content version.inc
    - name: mkdir in deps directory
      run: mkdir deps/destdir
    - name: download deps
      uses: actions/download-artifact@v4
      with:
        name: deps_win
        path: deps/destdir
    - name: echo dir deps
      run: dir deps
    - name: echo dir deps destdir
      run: dir deps/destdir
    - name: mkdir
      run: mkdir build
    - name: cmake
      working-directory: ./build
      run: cmake .. -G "Visual Studio 17 2022" -A x64 -T v142 -DCMAKE_PREFIX_PATH="${{ github.workspace }}\deps\destdir\usr\local"
    - name: make
      working-directory: ./build
      run: msbuild /m /P:Configuration=Debug INSTALL.vcxproj
    - name: make .mo
      working-directory: ./build
      run: msbuild /m /P:Configuration=Debug gettext_po_to_mo.vcxproj
    - name: create directory and copy into it
      working-directory: ./build
      run: ls
    - name: create directory and copy into it
      working-directory: ./build
      shell: powershell
        #todo: add the opengl folder
      run: mkdir package
    - name: copy from release
      working-directory: ./build
      shell: powershell
      run: '(new-object System.Net.WebClient).DownloadFile("https://github.com/supermerill/SuperSlicer_deps/releases/download/1.75/Slic3r_win_build.zip", "Slic3r_win_build.zip")'
    - name: unzip
      working-directory: ./build
      shell: cmd
      run: '"C:/Program Files/7-Zip/7z.exe" x Slic3r_win_build.zip'
    - name: copy missing dll content from old release
      working-directory: ./build
      shell: cmd
      run: |
        xcopy /RCYIE Slic3r_win_build\*.dll package\
        xcopy /RCYIE Slic3r_win_build\local-settings.bat package\${{ github.event.repository.name }}_local-settings.bat
        xcopy /RCYIE Slic3r_win_build\mesa package\
    - name: copy new resources
      working-directory: ./build
      shell: cmd
      run: xcopy /RCYIE ..\resources package\resources
    - name: copy dll & exe
      working-directory: ./build
      shell: cmd
      run: |
        xcopy /RCYIE src\debug\*.dll package\
        xcopy /RCYIE src\debug\*.exe package\
        xcopy /RCYIE src\debug\*.pdb package\
        xcopy /RCYIE c:\windows\system32\VCRUNTIME140* package\
        del package\opengl32.dll
#    - name: create zip
#      working-directory: ./build
#      shell: cmd
#      run: '"C:/Program Files/7-Zip/7z.exe" a -tzip nightly.zip *'
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: nightly_win64_debug
        path: build/package/
